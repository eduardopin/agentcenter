name: Feature request
description: Propose a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like AgentCenter to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you tried.
  - type: dropdown
    id: agents
    attributes:
      label: Agents involved
      description: Which agent sessions this concerns, if any.
      multiple: true
      options:
        - Claude Code
        - Codex
        - pi
        - Copilot
        - Kiro
        - Gemini
        - opencode
        - Not agent specific
