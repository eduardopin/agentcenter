# cargo-about config: the licences the dependency graph may carry. A crate
# under any other licence fails the release build instead of shipping unseen.
accepted = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
workarounds = []

# The workspace crates are publish = false; keep them out of the third-party list.
private = { ignore = true }
