[package]
name = "agentcenter"
description = "AgentCenter desktop app: AI coding sessions as a GTK4 + libadwaita resource monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentcenter"
path = "src/main.rs"

# Features casam o que o Ubuntu 26.04 instala (GTK 4.22.4, libadwaita 1.9.1):
# o build falha cedo, no pkg-config, numa maquina com versao mais velha.
[dependencies]
agentcenter-core.workspace = true
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
# Ja vem no grafo pelo glib (mesma versao do Cargo.lock): o aviso "chegou
# frame" da thread de repasse para o laco do GTK, sem crate nova.
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
# Modo fixture (AGENTCENTER_SNAPSHOT_JSON): a mesma versao que o core ja usa.
serde_json = "1.0.154"
