  <text class="row" x="36" y="116">codex      1      3   0.0  9.9M    0B     32K       0B         0%  -     local busy    36%  ~/project</text>
  <text class="total" x="36" y="149">TOTAL 1    -    3/3   0.0  9.9M    0B     32K       0B  delayacct  0</text>
  <text class="row" x="36" y="182">  machine: 16 cores, 98.4% cpu, mem 27G/38G, swap 25G/27G, psi some10 cpu 55.9% mem 6.3% io 24.6%</text>
  <line x1="36" y1="217" x2="1244" y2="217" stroke="#2a3a32"/>
