[workspace]
resolver = "3"
members = ["crates/agentcenter-core", "crates/agentcenter-cli", "crates/agentcenter"]

[workspace.package]
version = "0.0.0-rc.1"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/eduardopin/agentcenter"
publish = false

[workspace.dependencies]
agentcenter-core = { path = "crates/agentcenter-core" }

[profile.release]
lto = "thin"
codegen-units = 4
# Symbols and debug info out of the shipped binaries; path remapping is in
# scripts/release-build.sh because the prefixes depend on the build machine.
strip = "symbols"
